name: Build & Push to ECR (Secrets with Account ID)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 보안을 위한 GITHUB_TOKEN에 코드 읽기 권한만 부여
    permissions:
      contents: read

    steps:
      # 소스 체크아웃, 가상 머신 환경으로 소스코드를 내려받음
      - name: Checkout
        uses: actions/checkout@v3

      # AWS 자격 증명 설정(Secrets 사용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ECR 로그인(계정 ID를 Secret에서 참조)
      - name: ECR Login
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # (선택) 이미지 태그 구성 : 커밋 해시 7자리 + latest
      - name: Prepare tags
        id: prep
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "REPO_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-app-repo" >> $GITHUB_ENV

      - name: Show env variables
        run: |
          echo "Image tag: $IMAGE_TAG"
          echo "Repository URI: $REPO_URI"

      # Gradle 권한 설정
      - name: Gradle 권한 설정
        run: chmod +x gradlew

      # Gradle 빌드 및 테스트
      - name: Gradle 빌드 및 테스트
        run: ./gradlew clean build

      # Docker 빌드
      - name: Docker Build
        run: |
          docker build -t "$REPO_URI:$IMAGE_TAG" -t "$REPO_URI:latest" .

      # ECR 푸시
      - name: Docker Push
        run: |
          docker push "$REPO_URI:$IMAGE_TAG"
          docker push "$REPO_URI:latest"